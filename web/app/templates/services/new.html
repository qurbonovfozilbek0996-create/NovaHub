{% extends "layouts/base.html" %}
{% block content %}
<div class="container-fluid py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
<div><h2 class="mb-1">Xizmat qo‘shish</h2><p class="text-muted mb-0">API xizmatidan tanlab NovaHub'ga qo‘shish</p></div>
<a href="/admin/services/page" class="btn btn-outline-secondary">← Xizmatlar</a>
</div>
<div class="card shadow-sm"><div class="card-body">
<form id="serviceForm">
<h5 class="mb-3">API xizmatini tanlash</h5>
<div class="row g-3">
<div class="col-md-4">
<label class="form-label">Provider</label>
<select id="provider_id" class="form-select" required></select>
</div>
<div class="col-md-8">
<label class="form-label">API xizmatini qidirish</label>
<input id="search" class="form-control" placeholder="ID yoki xizmat nomi...">
</div>
<div class="col-12">
<button type="button" id="loadBtn" class="btn btn-outline-primary">🔄 API xizmatlarini yuklash</button>
<span id="count" class="ms-2 text-muted"></span>
</div>
<div class="col-12">
<div id="apiList" class="list-group" style="max-height:400px;overflow:auto"></div>
</div>
<div class="col-12"><hr><h5>Tanlangan xizmat</h5></div>
<div class="col-md-6">
<label class="form-label">API nomi</label>
<input id="api_name" class="form-control" readonly>
</div>
<div class="col-md-6">
<label class="form-label">NovaHub xizmat nomi</label>
<input id="name" class="form-control" required>
</div>
<div class="col-md-4">
<label class="form-label">Platforma</label>
<select id="platform_id" class="form-select" required></select>
</div>
<div class="col-md-4">
<label class="form-label">Kategoriya</label>
<select id="category_id" class="form-select" required></select>
</div>
<div class="col-md-4">
<label class="form-label">Provider</label>
<input id="provider_show" class="form-control" readonly>
</div>
<div class="col-md-4">
<label class="form-label">API narxi</label>
<input id="api_price" type="number" step="0.000001" class="form-control" readonly>
</div>
<div class="col-md-4">
<label class="form-label">Ustama (%)</label>
<input id="markup" type="number" step="0.01" min="0" class="form-control" value="10">
</div>
<div class="col-md-4">
<label class="form-label">Sotuv narxi</label>
<input id="sale_price" type="number" step="0.000001" class="form-control" readonly>
</div>
<div class="col-md-4">
<label class="form-label">Minimal miqdor</label>
<input id="min_quantity" type="number" class="form-control" readonly>
</div>
<div class="col-md-4">
<label class="form-label">Maksimal miqdor</label>
<input id="max_quantity" type="number" class="form-control" readonly>
</div>
<div class="col-md-4">
<label class="form-label">Tartib</label>
<input id="sort_order" type="number" class="form-control" value="0">
</div>
<div class="col-md-4">
<label class="form-label">Holati</label>
<select id="is_active" class="form-select">
<option value="true">Faol</option>
<option value="false">Nofaol</option>
</select>
</div>
</div>
<div id="message" class="mt-4"></div>
<div class="d-flex gap-2 mt-4">
<button class="btn btn-primary" type="submit">💾 Xizmatni saqlash</button>
<a href="/admin/services/page" class="btn btn-outline-secondary">Bekor qilish</a>
</div>
</form>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let apiServices=[];
let selectedApi=null;

async function loadProviders(){
const r=await fetch("/admin/providers/");
const d=await r.json();
$("provider_id").innerHTML=(d.items||[]).filter(x=>x.is_active).map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
if(!$("provider_id").value)$("provider_id").innerHTML=(d.items||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
await loadApi();
}

async function loadPlatforms(){
const r=await fetch("/admin/platforms/");
const d=await r.json();
$("platform_id").innerHTML=(d.items||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
await loadCategories();
}

async function loadCategories(){
const id=$("platform_id").value;
if(!id)return;
const r=await fetch("/admin/categories/?platform_id="+id);
const d=await r.json();
$("category_id").innerHTML=(d.items||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
}

async function loadApi(){
const provider=$("provider_id").value;
if(!provider)return;
const r=await fetch("/admin/services/api-services?provider_id="+provider);
const d=await r.json();
apiServices=d.items||[];
$("count").textContent=`✅ ${apiServices.length} ta API xizmati topildi.`;
renderApi();
}

function renderApi(){
const q=$("search").value.toLowerCase().trim();
$("apiList").innerHTML=apiServices.filter(x=>String(x.service_id).includes(q)||(x.api_name||"").toLowerCase().includes(q)).map(x=>`
<button type="button" class="list-group-item list-group-item-action text-start" onclick='selectApi(${JSON.stringify(x)})'>
<b>#${x.service_id}</b> ${x.api_name||""} <strong>${x.api_price}</strong>
<br><small>Min: ${x.min_quantity} · Max: ${x.max_quantity}</small>
</button>`).join("");
}

function selectApi(x){
selectedApi=x;
$("api_name").value=x.api_name||"";
$("name").value=x.api_name||"";
$("provider_show").value=$("provider_id").selectedOptions[0]?.text||"";
$("api_price").value=x.api_price||0;
$("min_quantity").value=x.min_quantity||0;
$("max_quantity").value=x.max_quantity||0;
calc();
$("message").innerHTML="";
}

function calc(){
const p=Number($("api_price").value||0);
const m=Number($("markup").value||0);
$("sale_price").value=(p+(p*m/100)).toFixed(6);
}

$("provider_id").onchange=loadApi;
$("platform_id").onchange=loadCategories;
$("markup").oninput=calc;
$("search").oninput=renderApi;

$("serviceForm").addEventListener("submit",async e=>{
e.preventDefault();
const msg=$("message");

if(!selectedApi){
msg.innerHTML='<div class="alert alert-warning">Avval API xizmatini tanlang.</div>';
return;
}

const data={
service_id:Number(selectedApi.service_id),
api_service_id:String(selectedApi.api_service_id),
name:$("name").value.trim(),
api_name:selectedApi.api_name||"",
provider_id:Number($("provider_id").value),
platform_id:Number($("platform_id").value),
category_id:Number($("category_id").value),
api_price:Number($("api_price").value),
sale_price:Number($("sale_price").value),
markup_percent:Number($("markup").value),
min_quantity:Number($("min_quantity").value),
max_quantity:Number($("max_quantity").value),
sort_order:Number($("sort_order").value||0),
is_active:$("is_active").value==="true",
is_featured:false
};

try{
const r=await fetch("/admin/services/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
const d=await r.json();
if(!r.ok)throw Error(d.detail||"Xizmatni saqlashda xatolik.");
msg.innerHTML='<div class="alert alert-success">✅ Xizmat muvaffaqiyatli qo‘shildi.</div>';
setTimeout(()=>location.href="/admin/services/page",700);
}catch(e){
msg.innerHTML=`<div class="alert alert-danger">❌ ${e.message}</div>`;
}
});

loadProviders();
loadPlatforms();
</script>
{% endblock %}
