<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platformlar — NovaHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Platformlar</h2>
            <p class="text-muted mb-0">Platformlarni boshqarish</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateForm()">
            + Platform qo‘shish
        </button>
    </div>

    <div id="createForm" class="card mb-4 d-none">
        <div class="card-body">
            <h5 class="mb-3">Yangi Platform</h5>
            <form onsubmit="createPlatform(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nomi</label>
                        <input id="platformName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Slug</label>
                        <input id="platformSlug" class="form-control" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Saqlash</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCreateForm()">Bekor qilish</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <strong>Platformlar ro‘yxati</strong>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nomi</th>
                        <th>Slug</th>
                        <th>Holati</th>
                        <th class="text-end">Amallar</th>
                    </tr>
                </thead>
                <tbody id="platformsTable">
                    <tr>
                        <td colspan="5" class="text-center py-5 text-muted">
                            Platformlar yuklanmoqda...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function openCreateForm() {
    document.getElementById("createForm").classList.remove("d-none");
}

function closeCreateForm() {
    document.getElementById("createForm").classList.add("d-none");
    document.getElementById("platformName").value = "";
    document.getElementById("platformSlug").value = "";
}

async function loadPlatforms() {
    const response = await fetch("/admin/platforms/");
    const data = await response.json();
    const table = document.getElementById("platformsTable");

    if (!response.ok || !data.success) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-5 text-danger">
                    Platformlarni yuklashda xatolik.
                </td>
            </tr>
        `;
        return;
    }

    table.innerHTML = "";

    if (!data.items || data.items.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-5 text-muted">
                    Hozircha platformlar mavjud emas.
                </td>
            </tr>
        `;
        return;
    }

    for (const platform of data.items) {
        const active = platform.is_active === true;

        table.innerHTML += `
            <tr>
                <td>${platform.id}</td>
                <td><strong>${escapeHtml(platform.name)}</strong></td>
                <td>${escapeHtml(platform.slug)}</td>
                <td>
                    ${
                        active
                        ? '<span class="badge bg-success">Faol</span>'
                        : '<span class="badge bg-secondary">Nofaol</span>'
                    }
                </td>
                <td class="text-end">
                    ${
                        active
                        ? `
                            <button class="btn btn-sm btn-outline-danger"
                                onclick="deactivatePlatform(${platform.id})">
                                O‘chirish
                            </button>
                        `
                        : `
                            <button class="btn btn-sm btn-outline-success"
                                onclick="activatePlatform(${platform.id})">
                                Faollashtirish
                            </button>
                        `
                    }
                </td>
            </tr>
        `;
    }
}

async function createPlatform(event) {
    event.preventDefault();

    const name = document.getElementById("platformName").value.trim();
    const slug = document.getElementById("platformSlug").value.trim();

    if (!name || !slug) {
        alert("Nomi va slugni kiriting.");
        return;
    }

    const response = await fetch("/admin/platforms/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            slug: slug
        })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Platform yaratishda xatolik.");
        return;
    }

    closeCreateForm();
    await loadPlatforms();
}

async function activatePlatform(id) {
    const response = await fetch(
        `/admin/platforms/${id}/activate`,
        { method: "PATCH" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Platformni faollashtirishda xatolik.");
        return;
    }

    await loadPlatforms();
}

async function deactivatePlatform(id) {
    const response = await fetch(
        `/admin/platforms/${id}/deactivate`,
        { method: "PATCH" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Platformni o‘chirishda xatolik.");
        return;
    }

    await loadPlatforms();
}

loadPlatforms();
</script>

</body>
</html>
