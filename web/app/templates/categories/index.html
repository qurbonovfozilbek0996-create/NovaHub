<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kategoriyalar — NovaHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Kategoriyalar</h2>
            <p class="text-muted mb-0">Kategoriyalarni boshqarish</p>
        </div>
        <button class="btn btn-primary" onclick="openForm()">+ Kategoriya qo‘shish</button>
    </div>

    <div id="formCard" class="card mb-4 d-none">
        <div class="card-body">
            <h5 class="mb-3">Yangi kategoriya</h5>

            <form onsubmit="createCategory(event)">
                <div class="mb-3">
                    <label class="form-label">Platforma</label>
                    <select id="platformId" class="form-select" required>
                        <option value="">Platformani tanlang</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kategoriya nomi</label>
                    <input id="categoryName" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success">Saqlash</button>
                <button type="button" class="btn btn-secondary" onclick="closeForm()">Bekor qilish</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <strong>Kategoriyalar ro‘yxati</strong>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nomi</th>
                        <th>Platforma ID</th>
                        <th>Holati</th>
                        <th class="text-end">Amallar</th>
                    </tr>
                </thead>

                <tbody id="categoriesTable">
                    <tr>
                        <td colspan="5" class="text-center py-5 text-muted">
                            Kategoriyalar yuklanmoqda...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function openForm() {
    document.getElementById("formCard").classList.remove("d-none");
    loadPlatforms();
}

function closeForm() {
    document.getElementById("formCard").classList.add("d-none");
    document.getElementById("platformId").value = "";
    document.getElementById("categoryName").value = "";
}

async function loadPlatforms() {
    const response = await fetch("/admin/platforms/");
    const data = await response.json();
    const select = document.getElementById("platformId");

    if (!response.ok || !data.success) {
        alert("Platformlarni yuklashda xatolik.");
        return;
    }

    select.innerHTML = '<option value="">Platformani tanlang</option>';

    for (const platform of data.items || []) {
        if (platform.is_active) {
            select.innerHTML += `
                <option value="${platform.id}">
                    ${escapeHtml(platform.name)}
                </option>
            `;
        }
    }
}

async function loadCategories() {
    const response = await fetch("/admin/categories/");
    const data = await response.json();
    const table = document.getElementById("categoriesTable");

    if (!response.ok || !data.success) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-5 text-danger">
                    Kategoriyalarni yuklashda xatolik.
                </td>
            </tr>
        `;
        return;
    }

    table.innerHTML = "";

    if (!data.items || data.items.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-5 text-muted">
                    Hozircha kategoriyalar mavjud emas.
                </td>
            </tr>
        `;
        return;
    }

    for (const category of data.items) {
        const active = category.is_active === true;

        table.innerHTML += `
            <tr>
                <td>${category.id}</td>
                <td><strong>${escapeHtml(category.name)}</strong></td>
                <td>${category.platform_id}</td>
                <td>
                    ${
                        active
                        ? '<span class="badge bg-success">Faol</span>'
                        : '<span class="badge bg-secondary">Nofaol</span>'
                    }
                </td>
                <td class="text-end">
                    ${
                        active
                        ? `
                            <button class="btn btn-sm btn-outline-danger"
                                onclick="deactivateCategory(${category.id})">
                                O‘chirish
                            </button>
                        `
                        : `
                            <button class="btn btn-sm btn-outline-success"
                                onclick="activateCategory(${category.id})">
                                Faollashtirish
                            </button>
                        `
                    }
                </td>
            </tr>
        `;
    }
}

async function createCategory(event) {
    event.preventDefault();

    const name = document.getElementById("categoryName").value.trim();
    const platformId = document.getElementById("platformId").value;

    if (!name || !platformId) {
        alert("Platforma va kategoriya nomini kiriting.");
        return;
    }

    const response = await fetch("/admin/categories/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            platform_id: Number(platformId)
        })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Kategoriya yaratishda xatolik.");
        return;
    }

    closeForm();
    await loadCategories();
}

async function activateCategory(id) {
    const response = await fetch(
        `/admin/categories/${id}/activate`,
        { method: "PATCH" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Kategoriyani faollashtirishda xatolik.");
        return;
    }

    await loadCategories();
}

async function deactivateCategory(id) {
    const response = await fetch(
        `/admin/categories/${id}/deactivate`,
        { method: "PATCH" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
        alert(data.detail || "Kategoriyani o‘chirishda xatolik.");
        return;
    }

    await loadCategories();
}

loadCategories();
</script>

</body>
</html>
